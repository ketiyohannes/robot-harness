name: arm_A2_sac
method: sac
task: arm_push_safely
seeds: [0, 1, 2]
total_steps: 100000     # same real-step budget as arm B/C
eval_every: 10000
learning_starts: 2000
safety_penalty: 1.0
net_arch: [256, 256]
torch_threads: 1
prefill_steps: 5000     # same waypoint exploration the planners pretrain on (counted in the budget)
prefill_policy: arm_waypoint
