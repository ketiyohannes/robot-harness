name: arm_C_verify_k4_long
method: iva
task: arm_push_safely
seeds: [0, 1]
torch_threads: 1
pretrain_steps: 5000        # random waypoint exploration (ArmWaypointExplorer), counted in the budget
pretrain_policy: arm_waypoint
pretrain_iters: 4000
train_budget: 200000        # total real env steps (pretrain + committed + branch)
eval_episodes: 30           # fixed EVAL_SEEDS, frozen world model
eval_traces: 5              # pickled decision traces for the video
trace_every: 10             # also trace every 10th training episode
agent:
  k_verify: 4
  act_steps: 10
  eps: 0.0
  retrain_every: 4000
  retrain_iters: 1500
  error_weighted: true
  cem:
    horizon: 20
    n_candidates: 4
    population: 128
    elites: 12
    iterations: 4
    lam: 2.0
    safe_margin: 0.05
